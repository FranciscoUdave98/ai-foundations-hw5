<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00356b" />
    <title>Campus Customs · Agent Desk</title>
    <meta name="description" content="The Campus Customs agent team at work: tickets, live agent chatter, approvals, and cash." />
    <style>
      /* Splash shown while the app loads; removed by src/main.tsx once React has painted. */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #00356b; color: #fff; transition: opacity 0.45s ease, visibility 0.45s; font-family: Georgia, serif; }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash .inner { display: grid; justify-items: center; gap: 14px; }
      #splash svg { width: 120px; height: 120px; animation: splash-bob 1s ease-in-out infinite; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35)); }
      #splash .splash-name { font-size: 30px; letter-spacing: 0.12em; text-transform: uppercase; animation: splash-in 0.7s ease-out both; }
      #splash .splash-tag { font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.75; animation: splash-in 0.7s 0.2s ease-out both; }
      @keyframes splash-bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
      @keyframes splash-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash svg, #splash .splash-name, #splash .splash-tag { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="inner">
        <!-- Handsome Dan (original illustration) -->
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#00356b" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M26 36 C12 26 3 42 9 56 C15 52 22 46 31 41 Z" fill="#ffffff" stroke="#ffffff" />
            <path d="M94 36 C108 26 117 42 111 56 C105 52 98 46 89 41 Z" fill="#ffffff" stroke="#ffffff" />
            <path d="M60 20 C84 20 100 30 102 50 C104 62 108 78 100 92 C94 102 78 108 60 108 C42 108 26 102 20 92 C12 78 16 62 18 50 C20 30 36 20 60 20 Z" fill="#fff" />
            <path d="M70 38 C80 34 91 40 91 50 C91 58 83 60 77 58 C71 56 66 48 70 38 Z" fill="#00356b" stroke="none" />
            <path d="M44 33 Q51 29 58 33" fill="none" stroke-width="2.4" />
            <path d="M62 33 Q69 29 76 33" fill="none" stroke-width="2.4" />
            <path d="M52 39 Q60 36 68 39" fill="none" stroke-width="2.4" />
            <circle cx="43" cy="50" r="5.5" fill="#00356b" stroke="none" />
            <circle cx="44.8" cy="48.2" r="1.6" fill="#fff" stroke="none" />
            <circle cx="79" cy="49" r="5.2" fill="#fff" stroke="none" />
            <circle cx="79" cy="49" r="3.5" fill="#00356b" stroke="none" />
            <path d="M37 82 C39 99 81 99 83 82 C74 88 46 88 37 82 Z" fill="#fff" />
            <path d="M60 71 V76" fill="none" stroke-width="2.6" />
            <path d="M60 76 C55 85 38 85 30 75" fill="#fff" stroke-width="2.8" />
            <path d="M60 76 C65 85 82 85 90 75" fill="#fff" stroke-width="2.8" />
            <path d="M42 88 L45.5 74 L49.5 86 Z" fill="#fff" stroke-width="2.2" />
            <path d="M70.5 86 L74.5 74 L78 88 Z" fill="#fff" stroke-width="2.2" />
            <path d="M47 62 C47 55 73 55 73 62 C73 68 66 71 60 71 C54 71 47 68 47 62 Z" fill="#00356b" />
          </g>
        </svg>
        <div class="splash-name">Agent Desk</div>
        <div class="splash-tag">Rounding up the team…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
